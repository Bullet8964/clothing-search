    function renderProducts(items) {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = items.map(p => {
        const urls = getImgUrls(p.imgNum);
        return `
          <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl transition duration-300">
            <div class="h-64 overflow-hidden bg-gray-200">
              <img src="${urls[0]}" 
                   data-try="0"
                   alt="${p.product_name}" 
                   class="w-full h-full object-cover object-center hover:scale-105 transition duration-300"
                   onerror="handleImageError(this, '${p.imgNum}')">
            </div>
            <div class="p-4">
              <div class="flex justify-between items-center mb-2">
                <span class="px-2 py-1 text-xs font-semibold bg-blue-100 text-blue-800 rounded-full">${p.category}</span>
                <span class="text-xs text-gray-500">${p.product_id}</span>
              </div>
              <h3 class="text-md font-bold text-gray-900 truncate">${p.product_name}</h3>
              <p class="text-blue-600 font-bold mt-2">NT$ ${p.price}</p>
            </div>
          </div>
        `;
      }).join('');
    }

    function handleImageError(img, imgNum) {
      const urls = getImgUrls(imgNum);
      let tryIndex = parseInt(img.getAttribute('data-try') || '0', 10) + 1;
      if (tryIndex < urls.length) {
        img.setAttribute('data-try', tryIndex);
        img.src = urls[tryIndex];
      } else {
        img.src = 'https://via.placeholder.com/300x400?text=Product+Image';
      }
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      const filtered = products.filter(p => 
        p.product_name.toLowerCase().includes(term) || 
        p.category.toLowerCase().includes(term) ||
        p.product_id.toLowerCase().includes(term)
      );
      renderProducts(filtered);
    });
